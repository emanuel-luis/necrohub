# The demo pipeline: `make demo` (= `uv run dvc repro`). Stages call the necrohub CLI. Run
# manifests go to runs/ (gitignored, not an out); metrics/<stage>.json are tracked in git.
# Model stages (train_*, evaluate) are compared with a tolerance by `necrohub check-repro`.
# deps list every necrohub source a stage imports (tests/unit/test_dvc_deps.py checks it) and
# uv.lock, since faker, fpdf2, pypdf, ftfy and pydantic versions shape the outputs.
stages:
  generate:
    cmd: necrohub generate --params params.yaml --out data/raw --metrics-dir metrics
    deps:
      - src/necrohub/generate
      - src/necrohub/contracts
      - src/necrohub/llm
      - src/necrohub/ids.py
      - src/necrohub/data
      - src/necrohub/preprocess/deid
      - src/necrohub/preprocess/normalize.py
      - src/necrohub/preprocess/sections.py
      - src/necrohub/ingest/readers.py
      - src/necrohub/settings.py
      - src/necrohub/params.py
      - src/necrohub/runs.py
      - src/necrohub/cli.py
      - uv.lock
    params:
      - seed
      - generate
    outs:
      - data/raw
    metrics:
      - metrics/generate.json:
          cache: false
  ingest:
    cmd: necrohub ingest --params params.yaml --in data/raw --out data/interim --metrics-dir metrics
    deps:
      - data/raw  # reports, and gold/ for the case list
      - src/necrohub/ingest
      - src/necrohub/contracts
      - src/necrohub/preprocess/normalize.py
      - src/necrohub/params.py
      - src/necrohub/runs.py
      - src/necrohub/cli.py
      - uv.lock
    params:
      - ingest
    outs:
      - data/interim
    metrics:
      - metrics/ingest.json:
          cache: false
  preprocess:
    cmd: >-
      necrohub preprocess --params params.yaml --in data/interim --out data/processed
      --raw data/raw --metrics-dir metrics
    deps:
      - data/interim
      - data/raw  # gold spans for the alignment metric
      - src/necrohub/preprocess
      - src/necrohub/contracts
      - src/necrohub/ids.py
      - src/necrohub/data
      - src/necrohub/ingest/readers.py
      - src/necrohub/settings.py
      - src/necrohub/params.py
      - src/necrohub/runs.py
      - src/necrohub/cli.py
      - uv.lock
    params:
      - preprocess
    outs:
      - data/processed
    metrics:
      - metrics/preprocess.json:
          cache: false
  build_dataset:
    cmd: >-
      necrohub build-dataset --params params.yaml --processed data/processed --raw data/raw
      --out data/datasets --metrics-dir metrics
    deps:
      - data/processed
      - data/raw  # gold records and the txt their spans refer to
      - src/necrohub/datasets
      - src/necrohub/contracts
      - src/necrohub/preprocess/align.py
      - src/necrohub/preprocess/deid
      - src/necrohub/preprocess/normalize.py
      - src/necrohub/params.py
      - src/necrohub/runs.py
      - src/necrohub/cli.py
      - uv.lock
    params:
      - seed
      - generate.holdout_templates
      - dataset
    outs:
      - data/datasets
    metrics:
      - metrics/build_dataset.json:
          cache: false
  train_ner:
    cmd: >-
      necrohub train --task ner --params params.yaml --data data/datasets
      --out models/encoder-ner --metrics-dir metrics
    deps:
      - data/datasets/ner
      - src/necrohub/train
      - src/necrohub/contracts
      - src/necrohub/preprocess/normalize.py
      - src/necrohub/params.py
      - src/necrohub/runs.py
      - src/necrohub/settings.py
      - src/necrohub/cli.py
      - uv.lock
    params:
      - seed
      - train
    outs:
      - models/encoder-ner
    metrics:
      - metrics/train_ner.json:
          cache: false
  train_sections:
    cmd: >-
      necrohub train --task sections --params params.yaml --data data/datasets
      --out models/encoder-sections --metrics-dir metrics
    deps:
      - data/datasets/sections
      - src/necrohub/train
      - src/necrohub/contracts
      - src/necrohub/preprocess/normalize.py
      - src/necrohub/params.py
      - src/necrohub/runs.py
      - src/necrohub/settings.py
      - src/necrohub/cli.py
      - uv.lock
    params:
      - seed
      - train
    outs:
      - models/encoder-sections
    metrics:
      - metrics/train_sections.json:
          cache: false
  evaluate:
    cmd: >-
      necrohub evaluate --params params.yaml --models models --data data/datasets
      --raw data/raw --out metrics/eval.json
    deps:
      - models/encoder-ner
      - models/encoder-sections
      - data/datasets
      - data/raw/gold  # the template of each test case
      - src/necrohub/evaluate
      - src/necrohub/train
      - src/necrohub/contracts
      - src/necrohub/preprocess/deid
      - src/necrohub/preprocess/normalize.py
      - src/necrohub/ingest/readers.py
      - src/necrohub/ids.py
      - src/necrohub/params.py
      - src/necrohub/runs.py
      - src/necrohub/settings.py
      - src/necrohub/cli.py
      - uv.lock
    params:
      - seed
      - generate.holdout_templates
      - evaluate
      - train.max_length
      - train.stride
    metrics:
      - metrics/eval.json:
          cache: false
