# Pipeline parameters (demo-sized defaults). Each stage reads its own section.
seed: 7
generate:
  n_cases: 24
  realizer: template  # template (CI, demo) or llm (local Ollama; see README)
  holdout_templates: [t3]
  holdout_fraction: 0.15
  max_reject_fraction: 0.2
  pdf_fraction: 0.25
  llm:
    backend: ollama  # or gemini (optional, paid, needs GEMINI_API_KEY)
    model: qwen3:4b-instruct-2507-q4_K_M
    temperature: 0.8
    max_attempts: 3
    timeout_s: 120
ingest:
  formats: [txt, pdf]  # a case with a PDF is read from the PDF (pypdf), otherwise from its txt
  max_pdf_length_drift: 0.15  # PDF text length within +-15 % of its txt twin
preprocess:
  normalize: [fix_text, nfc, newlines, nbsp, trailing_ws, blank_lines]
  deidentifiers: [regex]  # add hf_ner with hf_ner.model set to a local or Hub model
  hf_ner:
    model: null
    threshold: 0.7
dataset:
  splits: {train: 0.8, validation: 0.1, test: 0.1}  # by case_id; held-out templates go to test only
  tasks: [ner, sections, extraction, qa]
  max_align_reject_fraction: 0.05  # gold spans that cannot be projected onto the processed text
train:
  base_model: tiny-scratch  # or a Hub id / local dir, e.g. pucpr/biobertpt-clin
  tasks: [ner, sections]
  max_length: 256
  stride: 64  # token overlap between windows of a long section
  epochs: 30  # demo; the full run overrides it
  batch_size: 8
  learning_rate: 2.0e-3  # tiny-scratch; the full run uses 5e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  fp16: false  # needs a CUDA device
  gradient_checkpointing: false
  save_steps: 200
  keep_checkpoints: false
  tiny: {vocab_size: 2000, hidden_size: 64, num_layers: 2, num_heads: 2, intermediate_size: 128}
evaluate:
  baselines: [regex]
embed:
  backend: hashing  # or hf (needs the ml extra and the model on disk or the Hub)
  dim: 256  # hashing only
  hf: {model: pucpr/biobertpt-clin, layer_weighting: last, max_length: 512, stride: 64}
index:
  chunk_tokens: 128  # word and punctuation tokens per chunk
  chunk_stride: 32  # tokens shared by consecutive chunks of a section
