# Pipeline parameters (demo-sized defaults). Each stage reads its own section.
seed: 7
generate:
  n_cases: 24
  realizer: template  # template (CI, demo) or llm (local Ollama; see README)
  holdout_templates: [t3]
  holdout_fraction: 0.15
  max_reject_fraction: 0.2
  pdf_fraction: 0.25
  llm:
    backend: ollama  # or gemini (optional, paid, needs GEMINI_API_KEY)
    model: qwen3:4b-instruct-2507-q4_K_M
    temperature: 0.8
    max_attempts: 3
    timeout_s: 120
