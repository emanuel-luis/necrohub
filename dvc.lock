schema: '2.0'
stages:
  generate:
    cmd: necrohub generate --params params.yaml --out data/raw --metrics-dir 
      metrics
    deps:
    - path: src/necrohub/contracts
      hash: md5
      md5: ea971bc9f11183e1e1e741936259c402.dir
      size: 9628
      nfiles: 5
    - path: src/necrohub/generate
      hash: md5
      md5: 77b5d372e5351c585014cad04d03f69b.dir
      size: 68784
      nfiles: 13
    params:
      params.yaml:
        generate:
          n_cases: 24
          realizer: template
          holdout_templates:
          - t3
          holdout_fraction: 0.15
          max_reject_fraction: 0.2
          pdf_fraction: 0.25
          llm:
            backend: ollama
            model: qwen3:4b-instruct-2507-q4_K_M
            temperature: 0.8
            max_attempts: 3
            timeout_s: 120
        seed: 7
    outs:
    - path: data/raw
      hash: md5
      md5: 243684e25ac3bd4a9eb5aedc60813776.dir
      size: 256105
      nfiles: 56
    - path: metrics/generate.json
      hash: md5
      md5: b83bca1e862ed6f694d2a288193b3784
      size: 854
  ingest:
    cmd: necrohub ingest --params params.yaml --in data/raw --out data/interim 
      --metrics-dir metrics
    deps:
    - path: data/raw
      hash: md5
      md5: 243684e25ac3bd4a9eb5aedc60813776.dir
      size: 256105
      nfiles: 56
    - path: src/necrohub/ingest
      hash: md5
      md5: 7f2c1e4793d268cf766056ab56d6f852.dir
      size: 6780
      nfiles: 3
    params:
      params.yaml:
        ingest:
          formats:
          - txt
          - pdf
          max_pdf_length_drift: 0.15
    outs:
    - path: data/interim
      hash: md5
      md5: 723779fd85c138ca987e96563694f1f2.dir
      size: 60008
      nfiles: 2
    - path: metrics/ingest.json
      hash: md5
      md5: dd4985b1e6863e760fe3b13a4cf58014
      size: 285
  preprocess:
    cmd: necrohub preprocess --params params.yaml --in data/interim --out 
      data/processed --raw data/raw --metrics-dir metrics
    deps:
    - path: data/interim
      hash: md5
      md5: 723779fd85c138ca987e96563694f1f2.dir
      size: 60008
      nfiles: 2
    - path: data/raw
      hash: md5
      md5: 243684e25ac3bd4a9eb5aedc60813776.dir
      size: 256105
      nfiles: 56
    - path: src/necrohub/preprocess
      hash: md5
      md5: 9d18adfb43738c1e2f214bf9c3b92938.dir
      size: 23942
      nfiles: 10
    params:
      params.yaml:
        preprocess:
          normalize:
          - fix_text
          - nfc
          - newlines
          - nbsp
          - trailing_ws
          - blank_lines
          deidentifiers:
          - regex
          hf_ner:
            model:
            threshold: 0.7
    outs:
    - path: data/processed
      hash: md5
      md5: 042cc082fd2eeb6d82038af85846feaa.dir
      size: 143336
      nfiles: 2
    - path: metrics/preprocess.json
      hash: md5
      md5: b482119f0ed0d0e24a1f056c331bddc4
      size: 782
  build_dataset:
    cmd: necrohub build-dataset --params params.yaml --processed data/processed 
      --raw data/raw --out data/datasets --metrics-dir metrics
    deps:
    - path: data/processed
      hash: md5
      md5: 042cc082fd2eeb6d82038af85846feaa.dir
      size: 143336
      nfiles: 2
    - path: data/raw
      hash: md5
      md5: 243684e25ac3bd4a9eb5aedc60813776.dir
      size: 256105
      nfiles: 56
    - path: src/necrohub/datasets
      hash: md5
      md5: 4a3223872e5318d669a53ec241c38222.dir
      size: 17863
      nfiles: 5
    params:
      params.yaml:
        dataset:
          splits:
            train: 0.8
            validation: 0.1
            test: 0.1
          tasks:
          - ner
          - sections
          - extraction
          - qa
          max_align_reject_fraction: 0.05
        generate.holdout_templates:
        - t3
        seed: 7
    outs:
    - path: data/datasets
      hash: md5
      md5: 0bca05f617400ac35b60c9785885fea3.dir
      size: 282580
      nfiles: 13
    - path: metrics/build_dataset.json
      hash: md5
      md5: ae8f0d7c3e29f6e411fa0c8216540fba
      size: 1260
