Laudo de Exame de Necropsia

$institute - {{CITY_UF}}
Telefone: {{PHONE}}
Laudo nº {{REPORT_NUMBER}}
Data do exame: {{EXAM_DATE}}
Hora do início: $start
Hora do término: $end

$Perito Médico-Legal: {{EXAMINER_NAME}} - CRM/$crm_uf {{CRM}}
Auxiliar de necropsia: {{ASSISTANT_NAME}}

<<SEC:IDENTIFICATION>>1. Identificação
