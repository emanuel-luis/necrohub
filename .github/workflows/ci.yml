name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

concurrency:
  # per event: a push to main would otherwise cancel a weekly or manual run left pending
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (ruff + identifier leak check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --locked
      # the same commands as `make lint`
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run necrohub check-identifiers

  type:
    name: type (mypy strict)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.12", enable-cache: true }
      # src imports torch, transformers and the LLM SDKs lazily, so mypy needs the extras
      - run: uv sync --locked --extra ml --extra cpu --extra ollama --extra genai --extra db --extra serve --extra ui
      - run: uv run mypy

  test-unit:
    name: test-unit (offline)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.12", enable-cache: true }
      # the LLM SDKs only so the client request-shape tests run (their clients are faked)
      # serve so the API tests run (with the memory store)
      - run: uv sync --locked --extra ollama --extra genai --extra serve --extra db
      # ml, db, external and slow stay deselected by the pytest config
      - run: uv run pytest

  test-db:
    name: test-db (pgvector)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        # the same pgvector image as compose.yaml, pinned by digest
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: necrohub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d necrohub" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only-not-a-secret@localhost:5432/necrohub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --locked --extra db --extra serve
      - run: uv run pytest -m db

  test-ml:
    name: test-ml (tiny models, offline)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --locked --extra ml --extra cpu
      - run: uv run pytest -m ml

  demo:
    name: demo (dvc repro, reproducibility gate)
    runs-on: ubuntu-latest
    needs: test-unit
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      HF_HUB_OFFLINE: "1"  # tiny-scratch never touches the network
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --locked --extra pipeline --extra ml --extra cpu
      # copies of what is committed, taken before the run rewrites dvc.lock and metrics/
      - run: |
          cp dvc.lock "$RUNNER_TEMP/dvc.lock"
          cp -r metrics "$RUNNER_TEMP/metrics"
      # the same command as `make demo`; there is no DVC cache here, so every stage runs
      - run: uv run dvc repro
      - run: uv run dvc status --quiet
      # the question the demo ends with: an answer and its citations from the fresh index
      - run: uv run necrohub query "Qual a causa da morte no caso c7-00003?"
      # data stages must come back bit for bit, model stages within a numeric tolerance
      # (CPU float results differ across OS and CPU; decision 17)
      - run: >-
          uv run necrohub check-repro
          --baseline-lock "$RUNNER_TEMP/dvc.lock" --baseline-metrics "$RUNNER_TEMP/metrics"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: metrics
          path: metrics/
          if-no-files-found: error

  compose-smoke:
    name: compose-smoke (db, loader, api, ui)
    runs-on: ubuntu-latest
    needs: test-unit
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.12", enable-cache: true }
      # a throwaway test value, not a secret; first, so the logs and down steps can always
      # interpolate compose.yaml even when an earlier step fails
      - run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-not-a-secret/' .env
      # hadolint/hadolint:latest-debian, pinned by the digest of its multi-arch index
      - run: >-
          docker run --rm -i
          hadolint/hadolint@sha256:9a3944b7fddcb947d1ffd90829ac1a6e5c30479223358f249d8b96c7d0019e27
          < Dockerfile
      # only the data stages up to the index (hashing embedder, no torch)
      - run: uv sync --locked --extra pipeline
      - run: uv run dvc repro index
      - run: docker compose build
      - run: docker compose up -d --wait db loader api ui
      - run: bash scripts/compose_smoke.sh
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down -v
        if: always()

  diagrams:
    name: diagrams (D2 render check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # the pinned D2 release, checked against its sha256 in the Makefile
      - run: make d2-install
      - run: make diagrams-check
      - name: Upload the rendered SVGs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagrams
          path: docs/diagrams/*.svg
          if-no-files-found: warn
          retention-days: 7
