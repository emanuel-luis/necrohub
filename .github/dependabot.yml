# Weekly update PRs, one per ecosystem: the SHA-pinned actions and uv.lock.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      github-actions: { patterns: ["*"] }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      uv: { patterns: ["*"] }
    ignore:
      # google-genai (2.33.0, the latest) requires tenacity<9.2.0, so a 9.2 bump can only
      # resolve by downgrading google-genai to 1.x, which breaks the Gemini client. Drop this
      # rule when google-genai lifts the cap.
      - dependency-name: tenacity
        versions: [">=9.2.0"]
